[package]
name = "corten-run"
version.workspace = true
edition = "2021"
description = "A full-stack Rust web framework: pages in html!, fragment patches, typed handlers and live feeds, on hyper."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["web", "framework", "html", "server-rendering", "hyper"]
categories = ["web-programming::http-server", "template-engine"]
readme = "../../README.md"

# The package is corten-run (on crates.io `corten` is an empty placeholder of someone else's); the
# library keeps the name corten, so apps write `use corten::...` and the paths corten-macros
# generates (`::corten::...`) resolve.
[lib]
name = "corten"

[dependencies]
# A body's bytes (`corten::http::Bytes`, hyper's), and a multipart body's pieces joined in room it
# reuses, so one sent a few bytes at a time does not allocate per piece.
bytes = "1"
corten-macros.workspace = true
# `alloc` for `try_join_all` over the listeners.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.3"
# The HTTP vocabulary (`StatusCode`, `HeaderMap`, `Uri`, `request::Parts`), which apps name as
# `corten::http`, the crate hyper and HTTP clients share.
http = "1"
# The body trait hyper reads and writes (`corten::http::Body` implements it).
http-body = "1"
# Already in hyper's tree: the projections `Body`'s wrappers and the event stream's pacing need,
# without `unsafe` in Corten.
pin-project-lite = "0.2"
# HTTP/1.1 on each connection (`corten::serve`), and a connection that switches protocols
# (`corten::upgrade`).
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
# The layer and service traits `App::layer` takes and `corten::Router` implements, so a tower
# layer (a rate limit, a trace span) goes around the app.
tower-layer = "0.3"
tower-service = "0.3"
# The path to its route, for Corten's router (`corten::Router`).
matchit = "0.8.4"
# A path parameter's percent-decoding, after the path is matched.
percent-encoding = "2"
# Percent-decoding form bodies and query strings (Corten's own `Form` and `Params`).
form_urlencoded = "1"
# Finding a multipart boundary fast whatever bytes the client sends, 2.3 to 35 times a
# byte-by-byte search (`memmem` is from 2.4). Already in serde_json's tree.
memchr = "2.4"
# Float digits for views. Already in serde_json's tree.
zmij = "1"
# `macros` for `tokio::select!` in the accept loop and shutdown.
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Always on for `Form` and `Query`; `json` adds the derive.
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", optional = true }
# Where in a JSON body a value did not fit (`Json`'s 422 names the path, as it did when it was
# axum's reader).
serde_path_to_error = { version = "0.1", optional = true }
corten-feed = { workspace = true, optional = true }
brotli = { version = "9", optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.14", default-features = false, optional = true }
# The tz database, bundled so an image without /usr/share/zoneinfo has it too.
# `tz-fat`: each zone's transitions written out for years ahead, so a lookup does not work them out
# from its rule.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"], optional = true }

# corten-macros has no dependencies. Everything else is opt-in except `log`.
[features]
default = ["log"]
# App::serve prints logs (errors, startup, shutdown) to stdout unless the app set a subscriber:
# a subscriber of Corten's own (src/log.rs), so the feature adds no dependency.
log = []
# Handler arguments of any Serialize type (JSON in the markup) and JSON screens for data clients.
json = ["serde/derive", "dep:serde_json", "dep:serde_path_to_error"]
# corten::types: TypeScript declarations for scripts and JSON Schema for agents, from the same
# reading of the types that #[derive(ToJson)] and #[derive(FromJson)] write and read them by.
# serde_json's `raw_value` (no dependency): a `Box<RawValue>` field is described as any JSON.
types = ["json", "serde_json/raw_value"]
# corten::compress: pages compressed per request (zstd, brotli, gzip), the runtime and assets
# compressed once at the highest brotli and gzip levels.
compress = ["dep:brotli", "dep:flate2", "dep:zstd"]
# corten::feed: live data for scripts (snapshot + ordered patches over server-sent events).
feed = ["json", "dep:corten-feed"]
# corten::agent: the app's actions as Model Context Protocol tools for AI agents.
agent = ["types"]
# The visitor's time zone with its rules (App::client_zone): `req.zone()`, and with
# App::zoned_dates dates written in it while Corten renders the request's answer (jiff and its
# bundled tz database).
zones = ["dep:jiff"]

# docs.rs documents every module, including the opt-in ones.
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "test-util", "time"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
# The tests compare src/log.rs's lines, colors included, with this crate's.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
