[package]
name = "corten-run"
version.workspace = true
edition = "2021"
description = "A full-stack Rust web framework: pages in html!, fragment patches, typed handlers and live feeds, on axum."
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["web", "framework", "html", "server-rendering", "axum"]
categories = ["web-programming::http-server", "template-engine"]
readme = "../../README.md"

# The package is corten-run (on crates.io `corten` is an empty placeholder of someone else's); the
# library keeps the name corten, so apps write `use corten::...` and the paths corten-macros
# generates (`::corten::...`) resolve.
[lib]
name = "corten"

[dependencies]
# Only the features Corten uses: its own `serve_on` loop on axum's `Listener` and `ConnectInfo`
# (`tokio`, `http1`) and the matched route a middleware stage reads (`matched-path`); Corten's
# `json` feature adds axum's, whose rejection `corten::Json` shares with `axum::Json`. Not
# `original-uri`, which inserts a copy of every request's URI that nothing reads, nor `form` and
# `query`, readers Corten has its own of (`Form`, `Params`), nor `tracing` and `tower-log`
# (#761). corten-feed asks for none either, so an app with `feed` gets the same set.
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "tokio"] }
# Already in axum's tree, at the version axum 0.8.9 needs (keep it at axum's): the extractor traits
# alone (`corten::extract`, and `FromRef` beside Corten's derive). axum's own paths also carry its
# derives of the same names when its `macros` feature is on anywhere in the build.
axum-core = "0.5.5"
# Already in axum's tree (its body's `Bytes` is this crate's): a multipart body's pieces joined in
# room it reuses, so one sent a few bytes at a time does not allocate per piece.
bytes = "1"
corten-macros.workspace = true
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
# Already in axum's tree: the HTTP vocabulary (`StatusCode`, `HeaderMap`, `Uri`, `request::Parts`),
# which apps name as `corten::http`, the crate hyper, axum and HTTP clients share.
http = "1"
# Already in axum's tree: the response body type, for the request signal.
http-body = "1"
# Already in axum's tree (axum::serve): a connection that switches protocols (corten::upgrade).
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
# Already in axum's tree: the traits App's middleware implements.
tower-layer = "0.3"
tower-service = "0.3"
# Percent-decoding form bodies and query strings (Corten's own `Form` and `Params`; axum's
# `form` and `query` features, which would also bring it, are off).
form_urlencoded = "1"
# Already in axum's tree (axum and serde_json): finding a multipart boundary fast whatever bytes
# the client sends, 2.3 to 35 times a byte-by-byte search (`memmem` is from 2.4).
memchr = "2.4"
# Already in axum's tree (through serde_json): float digits for views.
zmij = "1"
tokio = { version = "1", default-features = false, features = ["net", "rt", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Already in axum's tree. Always on for `Form` and `Query`; `json` adds the derive.
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", optional = true }
corten-feed = { workspace = true, optional = true }
brotli = { version = "9", optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.14", default-features = false, optional = true }
# The tz database, bundled so an image without /usr/share/zoneinfo has it too.
# `tz-fat`: each zone's transitions written out for years ahead, so a lookup does not work them out
# from its rule.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"], optional = true }

# corten-macros has no dependencies. Everything else is opt-in except `log`.
[features]
default = ["log"]
# App::serve prints logs (errors, startup, shutdown) to stderr unless the app set a subscriber:
# a subscriber of Corten's own (src/log.rs), so the feature adds no dependency.
log = []
# Handler arguments of any Serialize type (JSON in the markup) and JSON screens for data clients.
json = ["serde/derive", "dep:serde_json", "axum/json"]
# corten::types: TypeScript declarations for scripts and JSON Schema for agents, from the same
# reading of the types that #[derive(ToJson)] and #[derive(FromJson)] write and read them by.
# serde_json's `raw_value` (no dependency): a `Box<RawValue>` field is described as any JSON.
types = ["json", "serde_json/raw_value"]
# corten::compress: pages compressed per request (zstd, brotli, gzip), the runtime and assets
# compressed once at the highest brotli and gzip levels.
compress = ["dep:brotli", "dep:flate2", "dep:zstd"]
# corten::feed: live data for scripts (snapshot + ordered patches over server-sent events).
feed = ["json", "dep:corten-feed"]
# corten::agent: the app's actions as Model Context Protocol tools for AI agents.
agent = ["types"]
# The visitor's time zone with its rules (App::client_zone): `req.zone()`, and with
# App::zoned_dates dates written in it while Corten renders the request's answer (jiff and its
# bundled tz database).
zones = ["dep:jiff"]

# docs.rs documents every module, including the opt-in ones.
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "test-util", "time"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
