[package]
name = "corten-pipeline"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.88"
description = "Prototype: Corten's request pipeline without axum, from the raw http response up."

# Not part of the Corten workspace: an experiment, built and measured on its own.
[workspace]

[lib]
name = "pipeline"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
matchit = "0.8"
pin-project-lite = "0.2"
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["net", "rt", "sync", "time", "macros"] }

[dev-dependencies]
# Only for examples/cost.rs, which measures the same request through Corten today and axum alone.
corten = { package = "corten-run", path = "../../crates/corten", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "test-util", "io-util", "net"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
