name: Catalog Contract

on:
  pull_request:
    paths:
      - .github/workflows/catalog.yml
      - bench/catalog/**
      - bench/json-api/**
      - bench/workloads/**
      - bench/marketplace/**
      - bench/fullstack/apps/**
      - bench/fullstack/apps.mjs
      - bench/fullstack/passes.mjs
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - scripts/steady.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog.yml
      - bench/catalog/**
      - bench/json-api/**
      - bench/workloads/**
      - bench/marketplace/**
      - bench/fullstack/apps/**
      - bench/fullstack/apps.mjs
      - bench/fullstack/passes.mjs
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - scripts/steady.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node bench/catalog/fixtures.mjs
      - run: node bench/marketplace/fixtures.mjs
      - run: npm run check:marketplace
      - run: node --test bench/catalog/*.test.mjs
        env:
          CATALOG_DOCKER_TESTS: "1"
      - run: node --test bench/fullstack/apps/*/catalog.test.mjs

  parity:
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        app: [corten, nextjs, tanstack-start, sveltekit, react-router, leptos, django, rails, laravel, aspnet, spring, phoenix, astro, nuxt, topcoat, axum-maud, gin, drogon, fastapi, express]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: node bench/catalog/fixtures.mjs
      - run: node bench/marketplace/fixtures.mjs
      - name: Test the standalone Corten app
        if: matrix.app == 'corten'
        run: cargo test --manifest-path bench/catalog/corten/Cargo.toml --locked
      - name: Test the localized Corten app
        if: matrix.app == 'corten'
        run: cargo test --manifest-path bench/marketplace/corten/Cargo.toml --locked
      # check-only still launches BOTH fixture and API sources and fails on any
      # structural, styling, escaping, navigation, schema, or upstream-read error.
      # This workflow does not measure/publish performance or touch nightly state.
      - name: Build and verify both catalog sources
        run: node bench/catalog/run.mjs c1 --apps ${{ matrix.app }} --build --check-only
      - name: Build and verify localized marketplace sources
        run: node bench/marketplace/run.mjs w1 --apps ${{ matrix.app }} --build --check-only
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-contract-${{ matrix.app }}
          path: |
            bench/catalog/results/c1/
            bench/marketplace/results/w1/
          if-no-files-found: warn
          retention-days: 14

  json-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run check:json-api

  json-aot:
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Test reflection-disabled native record sources
        run: >-
          docker run --rm
          -v "$PWD/bench/fullstack/apps/aspnet-aot:/src" -w /src
          mcr.microsoft.com/dotnet/sdk:10.0
          dotnet run --project tests/Records.Tests.csproj -c Release
      - name: Publish the native AOT JSON adapter
        run: docker build -t catalog-json-aot bench/fullstack/apps/aspnet-aot
      - name: Verify both complete payloads and sources on the native executable
        run: node bench/fullstack/apps/aspnet-aot/tests/check-native.mjs catalog-json-aot
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-json-aot-evidence
          path: bench/fullstack/apps/aspnet-aot/tests/results/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove the verification image
        if: always()
        run: docker image rm catalog-json-aot || true
