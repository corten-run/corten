# Temporary: proves release.yml's two Linux musl builds on the Ubuntu 26.04 runners before a tag
# needs them (review of #1909). Removed before the pull request merges.
name: Musl probe
on:
  pull_request:
    paths: [.github/workflows/musl-probe.yml]
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-26.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-26.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --release --locked -p corten-cli --target ${{ matrix.target }}
      - run: |
          file target/${{ matrix.target }}/release/corten
          target/${{ matrix.target }}/release/corten --version
          tar -czf corten-${{ matrix.target }}.tgz -C target/${{ matrix.target }}/release corten
          ls -l corten-${{ matrix.target }}.tgz