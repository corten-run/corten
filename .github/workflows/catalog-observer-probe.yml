name: Catalog observer diagnostic

# One disposable hosted runner, not a marketplace round. No main-push job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/catalog-observer-probe.yml
      - scripts/catalog-observer-probe.mjs
      - scripts/catalog-observer-probe.test.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/catalog-observer-probe.test.mjs
      - run: node bench/catalog/fixtures.mjs
      - name: Observe the first Corten catalog build and both source checks
        shell: bash
        run: |
          set -euo pipefail
          nonce=$(node -p 'require("node:crypto").randomBytes(8).toString("hex")')
          unit="corten-bench-groups-r900000001-$nonce.service"
          test "$(systemctl show "$unit" --property=LoadState --value)" = not-found
          work=$(mktemp -d "$RUNNER_TEMP/catalog-bootstrap.XXXXXXXX")
          node --input-type=module - "$unit" > "$work/entry.sh" <<'JS'
          import {supervisorBootstrap} from './bench/workloads/cloud-contract.mjs';
          console.log('set -euo pipefail');
          console.log(supervisorBootstrap(process.argv[2]));
          console.log('exec "$1" scripts/catalog-observer-probe.mjs');
          JS
          # Wait on the systemd client so Bash can handle TERM while the unit runs.
          cleanup() {
            rc=$?
            trap - EXIT
            trap '' INT TERM HUP
            # A signal can arrive before systemd-run registers the transient unit.
            client=${client:-${!:-}}
            for ((i=0; i<30; i++)); do
              [[ -n $client ]] && kill -0 "$client" 2>/dev/null || break
              [[ $(systemctl show "$unit" -p LoadState --value) == not-found ]] || break
              sleep 1
            done
            if [[ $(systemctl show "$unit" -p Description --value) == "Catalog diagnostic $nonce" ]]; then
              # --collect may remove it between show and stop; the checks below decide.
              timeout 165 sudo systemctl stop "$unit" || :
            fi
            for ((i=0; i<10; i++)); do
              [[ $(systemctl show "$unit" -p LoadState --value) != not-found ]] || break
              sleep 1
            done
            test "$(systemctl show "$unit" -p LoadState --value)" = not-found || rc=1
            if [[ -n $client ]] && kill -0 "$client" 2>/dev/null; then rc=1; fi
            exit "$rc"
          }
          trap cleanup EXIT
          trap 'exit 130' INT TERM HUP
          sudo systemd-run --quiet --pipe --wait --collect --unit="$unit" --description="Catalog diagnostic $nonce" \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
            --property='Delegate=cpu cpuset memory pids' --property=DelegateSubgroup=supervisor \
            --property=KillMode=control-group --property=Restart=no --property=RuntimeMaxSec=2100 \
            --property=TimeoutStopSec=150 --setenv="RUNNER_TEMP=$RUNNER_TEMP" --setenv="HOME=$HOME" \
            --setenv="PATH=$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin" \
            /bin/bash "$work/entry.sh" "$(command -v node)" &
          client=$!
          wait "$client"
