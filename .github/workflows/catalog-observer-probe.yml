name: Catalog observer diagnostic

# One disposable hosted runner, not a marketplace round. No main-push job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/catalog-observer-probe.yml
      - scripts/catalog-observer-probe.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
      - run: node bench/catalog/fixtures.mjs
      - name: Observe the first Corten catalog build and both source checks
        shell: bash
        run: |
          set -euo pipefail
          nonce=$(node -p 'require("node:crypto").randomBytes(8).toString("hex")')
          unit="corten-bench-groups-r900000001-$nonce.service"
          test "$(systemctl show "$unit" --property=LoadState --value)" = not-found
          sudo systemd-run --quiet --pipe --wait --collect --unit="$unit" \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
            --property='Delegate=cpu cpuset memory pids' --property=DelegateSubgroup=supervisor \
            --property=KillMode=control-group --property=Restart=no --property=RuntimeMaxSec=2100 \
            --property=TimeoutStopSec=150 --setenv="RUNNER_TEMP=$RUNNER_TEMP" --setenv="HOME=$HOME" \
            --setenv="PATH=$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin" \
            "$(command -v node)" scripts/catalog-observer-probe.mjs
      - name: Retain observations, including failed attempts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catalog-observer-diagnostic
          retention-days: 7
          path: |
            ${{ runner.temp }}/catalog-observer-probe/
            bench/catalog/results/c900000001/summary.json
            bench/catalog/results/c900000001/image-corten.json
            bench/catalog/results/c900000001/build-corten.log
            bench/catalog/results/c900000001/run.log
