# Replay and observer controls, not an official benchmark or framework qualification.
name: Benchmark Evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      native_only:
        description: Run only the native Linux check
        type: boolean
        default: false

# Keep every main run; only newer PR runs supersede older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      kernel: ${{ steps.scope.outputs.kernel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: scope
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/benchmark-scope.mjs evidence

  evidence:
    needs: scope
    if: needs.scope.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.native_only)
    name: benchmark evidence (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [core, contracts, browser]
    steps:
      # Source replay needs the actual history and evidence tags, without lazy fetching.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bench/package-lock.json
            bench/browser/package-lock.json
      - run: npm ci
      # The harness's classic TypeScript compiler, whose locked archive the tool replay reads too.
      - run: npm --prefix bench ci
      - run: npm --prefix bench/browser ci
        if: matrix.suite == 'browser'
      - name: Prepare the existing Git-capable Playwright test image
        run: |
          image="mcr.microsoft.com/playwright:v$(node -p 'require("@playwright/test/package.json").version')-noble"
          docker pull "$image"
          docker build --build-arg PLAYWRIGHT_IMAGE="$image" -f bench/workloads/test-tools.Dockerfile -t corten-evidence-tools .
      - name: Run serial evidence controls as the checkout owner
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          # Tool-byte replay reads the integrity-checked archives npm ci actually used.
          # No Docker socket is exposed: native application qualification is separate.
          docker run --rm --init --ipc host --network host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/npm-cache \
            -v "$PWD:/src" -v "$(npm config get cache):/npm-cache:ro" -w /src \
            corten-evidence-tools npm run "check:groups:evidence:$SUITE"
          if [[ "$SUITE" == "browser" ]]; then
            docker run --rm --init --ipc host --network host \
              --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src \
              corten-evidence-tools node --test bench/client-heavy/dependency-smoke.test.mjs
          fi

  kernel:
    needs: scope
    if: needs.scope.outputs.kernel == 'true'
    name: benchmark evidence (native Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Exercise dedicated SSH ingress bootstrap with simulated APT contention
        run: node --test --test-name-pattern='SSH ingress' bench/workloads/cloud-bootstrap-execution.test.mjs
      - name: Exercise dedicated SSH ingress in private Linux namespaces
        run: |
          if [[ ! -x /usr/sbin/nft ]]; then
            sudo apt-get update -qq
            sudo env NEEDRESTART_SUSPEND=1 apt-get install -y -qq --no-install-recommends nftables
          fi
          sudo /bin/bash scripts/benchmark-ssh-ingress-ci.sh "$(command -v node)"
      # Docker Hub has refused this job's image pull with toomanyrequests (#1499).
      # Adds Google's Hub cache to the daemon's registry mirrors, which it tries before falling
      # back to Hub, and reloads Docker without restarting it; the reference stays Hub's. The
      # script runs only on this disposable hosted runner and fails the job if Docker does not
      # list the cache within a minute; it rolls nothing back.
      - name: Add Google's Docker Hub cache to Docker's registry mirrors
        # sudo resets the environment, so the two variables the script's guard reads are passed on.
        run: sudo env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" CI="$CI" /bin/bash scripts/ci-docker-hub-mirror.sh "$(command -v node)"
      - name: Exercise actual delegated process and Docker participant boundaries
        run: sudo /bin/bash scripts/benchmark-kernel-ci.sh "$(command -v node)" "$PWD"
      - name: Prove bracketed JSON resource reads on a synthetic Docker participant
        timeout-minutes: 3
        run: |
          docker_local() {
            local limit=$1
            shift
            timeout --kill-after=2s "$limit" docker --host unix:///var/run/docker.sock "$@"
          }
          image='node:26.13.1-trixie-slim@sha256:615a27817f7b9508f0de73eb1cc8fc8894ab122bee56c1a7a568b72cd1032067'
          docker_local 45s pull "$image"
          key=corten.json.resource-probe-attempt
          attempt=$(node -p 'require("node:crypto").randomUUID()')
          id=
          owns() {
            local candidate=$1 receipt
            [[ "$candidate" =~ ^[a-f0-9]{64}$ ]] || return 1
            receipt=$(docker_local 3s container inspect --format \
              '{{.Id}} {{index .Config.Labels "corten.json.resource-probe"}} {{index .Config.Labels "corten.json.resource-probe-attempt"}}' "$candidate") || return 2
            [[ "$receipt" == "$candidate 1 $attempt" ]]
          }
          cleanup() {
            local candidate=$id found pending= retry
            if [[ -z "$candidate" ]]; then
              # A timed-out create can reach the daemon without returning its ID. Allow
              # four lookup/inspect attempts and three sleeps (at most 39s before removal).
              # Retry absence or transport failure, never a disproved or changing identity.
              for retry in 1 2 3 4; do
                if found=$(docker_local 2s ps --all --no-trunc --filter "label=$key=$attempt" --format '{{.ID}}') && [[ -n "$found" ]]; then
                  [[ -z "$pending" || "$pending" == "$found" ]] || break
                  pending=$found
                  if owns "$found"; then
                    candidate=$found
                    break
                  elif (( $? != 2 )); then
                    break
                  fi
                fi
                if [[ "$retry" != 4 ]]; then sleep 1; fi
              done
            elif ! owns "$candidate"; then
              candidate=
            fi
            if [[ -z "$candidate" ]]; then
              echo 'Synthetic JSON resource probe cleanup could not confirm one owned container' >&2
              return 1
            fi
            docker_local 10s rm -f -v "$candidate" >/dev/null
          }
          trap 'status=$?; trap - EXIT; if ! cleanup && (( status == 0 )); then status=1; fi; exit "$status"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          candidate=$(docker_local 45s create --pull=never --network none --cpus 1 --memory 128m \
            --restart=no --label corten.json.resource-probe=1 --label "$key=$attempt" --entrypoint node "$image" \
            -e 'const mem = Buffer.alloc(8 * 1024 * 1024, 1);
                const work = setInterval(() => {
                  const until = performance.now() + 10;
                  while (performance.now() < until) mem[0] ^= 1;
                }, 100);
                setTimeout(() => clearInterval(work), 9000);')
          owns "$candidate" || exit 1
          id=$candidate
          timeout --kill-after=2s 30s node bench/json-api/load-resource-probe.mjs "$id"
