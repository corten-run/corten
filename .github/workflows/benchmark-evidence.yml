# Replay and observer controls, not an official benchmark or framework qualification.
name: Benchmark Evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      native_only:
        description: Run only the native Linux check
        type: boolean
        default: false

# Keep every main run; only newer PR runs supersede older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      kernel: ${{ steps.scope.outputs.kernel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: scope
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/benchmark-scope.mjs evidence

  git-packages:
    needs: scope
    if: needs.scope.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.native_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      checksum: ${{ steps.packages.outputs.checksum }}
      image: ${{ steps.packages.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test cold, offline and rejected Git packages
        run: bash scripts/benchmark-evidence-git.test.sh
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-ppa
          key: evidence-git-noble-amd64-${{ hashFiles('scripts/benchmark-evidence-git.sh') }}
      - id: packages
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          mode=cold; if [[ "$CACHE_HIT" == true ]]; then mode=warm; fi
          bash scripts/benchmark-evidence-git.sh "$mode" "$RUNNER_TEMP/git-ppa" "$RUNNER_TEMP/packages"
          cd "$RUNNER_TEMP/packages"
          checksum=$(sha256sum git.deb git-man.deb | sha256sum)
          echo "checksum=${checksum%% *}" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"
          version=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')
          image="mcr.microsoft.com/playwright:v${version}-noble"
          digest=$(docker buildx imagetools inspect "$image" | awk '$1=="Digest:"{print $2}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
      # Only main seeds a shared cache. A hit still undergoes full verification.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/git-ppa
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-git-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages/*.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  evidence:
    needs: [scope, git-packages]
    if: "!cancelled() && needs.scope.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.native_only)"
    name: benchmark evidence (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [core, contracts, browser]
    steps:
      - name: Require verified tooling
        env:
          RESULT: ${{ needs.git-packages.result }}
        run: test "$RESULT" = success
      # Source replay needs the actual history and evidence tags, without lazy fetching.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bench/package-lock.json
            bench/browser/package-lock.json
      - run: npm ci
      # The harness's classic TypeScript compiler, whose locked archive the tool replay reads too.
      - run: npm --prefix bench ci
      - run: npm --prefix bench/browser ci
        if: matrix.suite == 'browser'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.git-packages.outputs.artifact }}
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Install verified Git in the locked Playwright base
        shell: bash
        env:
          IMAGE: ${{ needs.git-packages.outputs.image }}
          CHECKSUM: ${{ needs.git-packages.outputs.checksum }}
        run: |
          image="mcr.microsoft.com/playwright:v$(node -p 'require("@playwright/test/package.json").version')-noble"
          [[ "$IMAGE" == "$image@"* && "${IMAGE##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
          cd "$RUNNER_TEMP/packages"
          checksum=$(sha256sum git.deb git-man.deb | sha256sum)
          test "${checksum%% *}" = "$CHECKSUM"
          docker build --pull --build-arg PLAYWRIGHT_IMAGE="$IMAGE" -f "$GITHUB_WORKSPACE/bench/workloads/evidence-tools.Dockerfile" -t corten-evidence-tools .
      - name: Run serial evidence controls as the checkout owner
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          # Tool-byte replay reads the integrity-checked archives npm ci actually used.
          # No Docker socket is exposed: native application qualification is separate.
          docker run --rm --init --ipc host --network host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/npm-cache \
            -v "$PWD:/src" -v "$(npm config get cache):/npm-cache:ro" -w /src \
            corten-evidence-tools npm run "check:groups:evidence:$SUITE"
          if [[ "$SUITE" == "browser" ]]; then
            docker run --rm --init --ipc host --network host \
              --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src \
              corten-evidence-tools node --test bench/client-heavy/dependency-smoke.test.mjs
          fi

  kernel:
    needs: scope
    if: needs.scope.outputs.kernel == 'true'
    name: benchmark evidence (native Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Exercise dedicated SSH ingress bootstrap with simulated APT contention
        run: node --test --test-name-pattern='SSH ingress' bench/workloads/cloud-bootstrap-execution.test.mjs
      - name: Exercise dedicated SSH ingress in private Linux namespaces
        run: |
          if [[ ! -x /usr/sbin/nft ]]; then
            sudo apt-get update -qq
            sudo env NEEDRESTART_SUSPEND=1 apt-get install -y -qq --no-install-recommends nftables
          fi
          sudo /bin/bash scripts/benchmark-ssh-ingress-ci.sh "$(command -v node)"
      - name: Exercise actual delegated process and Docker participant boundaries
        run: sudo /bin/bash scripts/benchmark-kernel-ci.sh "$(command -v node)" "$PWD"
