[package]
name = "p1938c-head"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "head"
path = "src/main.rs"

# Features of corten: the template's (the defaults, and compress). The probe's own `named` is on
# for head only (see src/main.rs); it changes one handler and nothing else.
[features]
default = ["named"]
named = []

[dependencies]
corten = { package = "corten-run", path = "../src-head/crates/corten", features = ["compress"] }
tokio = { version = "1", features = ["macros", "rt"] }

# The repository's release profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
