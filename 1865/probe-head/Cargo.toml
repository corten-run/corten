[package]
name = "p1865-head"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "head"
path = "src/main.rs"

# Features as `corten new`'s template asks for them: the defaults (log) and compress. Third-party
# versions come from the source tree's Cargo.lock, which export-src.ps1 copies here.
[dependencies]
corten = { package = "corten-run", path = "../src-head/crates/corten", features = ["compress"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

# The repository's release profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]