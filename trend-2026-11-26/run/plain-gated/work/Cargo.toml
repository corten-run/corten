[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]
exclude = ["bench"]

# Every published crate shares one version, released together (RELEASING.md).
[workspace.package]
version = "0.3.0"
license = "MIT"
repository = "https://github.com/corten-run/corten"
homepage = "https://corten.run"
rust-version = "1.89"

# The crates depend on each other at exactly the workspace version: a path for building here,
# the version for crates.io. Bump these with `workspace.package.version`. `corten` comes without its
# default features, so a crate that depends on it picks its own (corten-ui needs none of them).
# Its package is corten-run and its library corten, so every member names it `corten`. The
# examples are not published and depend on the crates by path.
[workspace.dependencies]
corten = { package = "corten-run", version = "0.3.0", path = "crates/corten", default-features = false }
corten-macros = { version = "0.3.0", path = "crates/corten-macros" }
corten-feed = { version = "0.3.0", path = "crates/corten-feed" }
corten-protocol = { version = "0.3.0", path = "crates/corten-protocol" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
