[package]
name = "p1846r5-base"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "base"
path = "src/main.rs"

# Features: the template's (the defaults, log, and compress) and json, which the JSON body (/records)
# needs, as #1846's and #1866's in-process probes were built (json and compress). Third-party
# versions come from the source tree's Cargo.lock, which export-src.ps1 copies here. tower and
# http-body-util only for the in-process `cg` mode (as tests/kept_coding_cost.rs drives the router).
[dependencies]
corten = { package = "corten-run", path = "../src-base/crates/corten", features = ["json", "compress"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

# The repository's release profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]