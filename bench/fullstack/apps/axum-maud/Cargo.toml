[package]
name = "item-page-axum-maud"
version = "0.1.0"
edition = "2024"
publish = false

# Not part of the Corten workspace.
[workspace]

[dependencies]
# A router and a template macro, nothing else: the hand-written Rust baseline.
axum = "=0.8.9"
maud = { version = "=0.27.0", features = ["axum"] }
# The matched tier's layers (PROFILE=matched) are tower-http's own: headers, compression, a
# deadline and a body limit.
tower-http = { version = "=0.7.1", features = ["fs", "set-header", "compression-br", "compression-gzip", "timeout", "limit"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
