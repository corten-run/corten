<!doctype html>
<html lang="en" th:lang="${marketplacePage == true ? locale : 'en'}" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, main)">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title}">Card Market</title>
<link rel="stylesheet" th:href="@{/style.css}">
<link rel="stylesheet" th:href="@{/components.css}">
<link rel="stylesheet" th:if="${catalogPage == true}" th:href="@{/catalog.css}">
<link rel="stylesheet" th:if="${marketplacePage == true}" th:href="@{/marketplace.css}">
<script th:src="@{/htmx.min.js}" defer></script>
<script th:src="@{/item.js}" defer></script>
</head>
<body hx-boost="true" th:attr="hx-boost=${marketplacePage == true ? 'false' : 'true'}">
<header class="site-header__bar"><a href="/">Card Market</a></header>
<main th:replace="${main}"></main>
</body>
</html>
