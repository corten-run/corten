<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${pageTitle}, ~{::main})}">
<main><article>
<div class="item-detail__top"><div class="item-detail__intro"><nav class="item-detail__crumbs"><a th:each="c : ${item.categories}" th:href="|/categories/${c.slug}|" th:text="${c.name}"></a></nav>
<h1 th:text="${item.title}"></h1>
<p class="item-detail__subtitle" th:if="${item.subtitle != null}" th:text="${item.subtitle}"></p>
<ul class="item-detail__chips"><li th:each="b : ${item.badges}" th:text="${b}"></li></ul></div>
<div class="item-detail__gallery" th:if="${!item.images.isEmpty()}"><div class="item-detail__image" role="img" th:each="url, s : ${item.images}" th:attr="aria-label=|${item.title} image ${s.count}|,data-src=${url}"></div></div>
<section class="item-detail__panel item-detail__summary gap-3 sm:gap-5" th:with="s=${item.summary}"><th:block th:if="${s != null}"><span><strong th:text="${s.lowest ?: '—'}"></strong> lowest</span><span th:text="|${#numbers.formatInteger(s.count, 1, 'COMMA')} ${s.count == 1 ? 'listing' : 'listings'}|"></span><span th:text="|${#numbers.formatInteger(s.quantity, 1, 'COMMA')} available|"></span></th:block><span th:if="${s == null}">No listings yet</span></section></div>
<section class="item-detail__panel">
<h2>Listings</h2>
<button type="button" data-sort><span>Price: low to high</span><span hidden>Price: high to low</span></button>
<table><thead><tr><th>Seller</th><th>Condition</th><th>Ships from</th><th>Qty</th><th>Price</th></tr></thead>
<tbody><tr th:each="l : ${listings}"><td th:text="${l.rating == null ? l.seller : l.seller + ' · ' + l.rating + ' ★ (' + l.reviews + ')'}"></td><td th:text="${l.condition}"></td><td th:text="${l.shipsFrom}"></td><td th:text="${l.quantity}"></td><td class="price__amount" th:text="${l.price}"></td></tr></tbody></table>
</section>
<section class="item-detail__panel" id="offers">
<h2>Offers</h2>
<table><thead><tr><th>Buyer</th><th>Condition</th><th>Qty</th><th>Price</th></tr></thead>
<tbody><tr th:each="o : ${offers}"><td th:text="${o.buyer}"></td><td th:text="${o.condition}"></td><td th:text="${o.quantity}"></td><td class="price__amount" th:text="${o.price}"></td></tr></tbody></table>
<button type="button" th:if="${moreOffers}" th:attr="hx-get=|/items/${item.id}?offers=all|" hx-select="#offers" hx-target="#offers" hx-swap="outerHTML" th:text="|Show all ${item.offers.size()} offers|"></button>
</section>
<section class="item-detail__panel">
<h2>Price alert</h2>
<div class="alert-form__form"><form method="post" th:action="|/items/${item.id}|" th:attr="hx-post=|/items/${item.id}|" hx-target="#alert-message" hx-swap="outerHTML">
<input type="hidden" name="item_id" th:value="${item.id}"><input type="hidden" name="title" th:value="${item.title}">
<label>Email<input type="email" name="email" required></label>
<label>Alert me below<input type="text" name="target_price" inputmode="decimal" required></label>
<button type="submit">Set alert</button></form></div>
<p class="alert-form__message" id="alert-message" aria-live="polite" th:fragment="message" th:text="${message}"></p>
</section>
<section class="item-detail__panel">
<h2>Details</h2>
<p th:text="${item.description}"></p>
<dl><th:block th:each="f : ${item.fields}"><dt th:text="${f.name}"></dt><dd th:text="${f.value}"></dd></th:block></dl>
<ul class="item-detail__chips" th:if="${!item.tags.isEmpty()}"><li th:each="t : ${item.tags}" th:text="${t}"></li></ul>
</section>
<section class="item-detail__panel" th:if="${!item.contents.isEmpty()}"><h2>Contents</h2><ul><li th:each="c : ${item.contents}"><a th:href="|/items/${c.itemId}|" th:text="${c.title}"></a> × <th:block th:text="${c.quantity}"></th:block></li></ul></section>
<section class="item-detail__panel" th:if="${!item.includedIn.isEmpty()}"><h2>Included in</h2><ul><li th:each="c : ${item.includedIn}"><a th:href="|/items/${c.itemId}|" th:text="${c.title}"></a> × <th:block th:text="${c.quantity}"></th:block></li></ul></section>
</article></main>
</html>
