# The matched tier's production profile (bench/fullstack/README.md, "The matched tier"), from Spring
# Boot's settings; Matched.java has the rest (Spring Security's headers, CSRF and host check).
# Actuator's auto-configuration back, for its liveness and readiness probes.
spring.autoconfigure.exclude=
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# gzip when asked (Tomcat has no br).
server.compression.enabled=true
# RFC 9457 problem details for the errors Spring MVC answers itself (a 405, a missing route).
spring.mvc.problemdetails.enabled=true
# A request head not finished within 30 s closes its connection; at most MAX_CONNECTIONS at once.
server.tomcat.connection-timeout=30s
server.tomcat.max-connections=${MAX_CONNECTIONS:8192}
