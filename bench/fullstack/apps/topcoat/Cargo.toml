[package]
name = "item-page-topcoat"
version = "0.1.0"
edition = "2024"
publish = false

# Not part of the Corten workspace.
[workspace]

[dependencies]
# Topcoat's defaults (router, views, runtime, assets, compression, ...), server-sent events, and its
# tower adapter, which runs the matched tier's tower-http layers (PROFILE=matched).
topcoat = { version = "=0.11.0", features = ["sse", "tower"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["set-header", "timeout"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
icu_decimal = "=2.4.0"
icu_experimental = "=0.7.0"
icu_locale = "=2.4.0"
icu_plurals = "=2.4.0"
icu_provider = { version = "=2.4.0", features = ["sync"] }
url = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
