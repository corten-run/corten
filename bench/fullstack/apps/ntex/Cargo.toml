[package]
name = "bench-ntex"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ntex = { version = "=4.11.1", default-features = false, features = ["serde", "tokio", "compress"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
