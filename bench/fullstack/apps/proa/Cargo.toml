[package]
name = "bench-proa"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
axum = "=0.8.9"
proa = { version = "=0.4.1", default-features = false }
proa_framework_axum = "=0.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7", features = ["fs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
