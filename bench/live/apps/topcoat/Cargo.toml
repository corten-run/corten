[package]
name = "live-parity-topcoat"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
topcoat = "=0.12.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
debug = 0
strip = "debuginfo"
