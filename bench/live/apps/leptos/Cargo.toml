[package]
name = "live-parity-leptos"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "=0.8.22"
leptos_axum = { version = "=0.8.10", optional = true }
axum = { version = "0.8", optional = true }
any_spawner = { version = "0.3", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"], optional = true }
futures = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
ssr = ["leptos/ssr", "dep:leptos_axum", "dep:axum", "dep:any_spawner", "dep:tokio", "dep:futures"]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:console_error_panic_hook"]

[profile.release]
debug = 0
strip = "debuginfo"

[package.metadata.leptos]
output-name = "live_parity"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "0.0.0.0:8080"
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "release"
