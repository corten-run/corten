# The proxy of the TCP_NODELAY measurement: the deploy guide's upstream settings
# (docs/guide/deploy.md#nginx), one upstream for each app, plain HTTP to the client. One worker, so
# every stream after the first to an app reuses the one kept-alive connection to it.
worker_processes 1;

events {}

http {
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream corten_default {
        server nodelay-default:8080;
        keepalive 16;
        keepalive_timeout 25s;
    }

    upstream corten_on {
        server nodelay-on:8080;
        keepalive 16;
        keepalive_timeout 25s;
    }

    upstream corten_off {
        server nodelay-off:8080;
        keepalive 16;
        keepalive_timeout 25s;
    }

    server {
        listen 80;

        location /default/ {
            proxy_pass http://corten_default/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection $connection_upgrade;
        }

        location /on/ {
            proxy_pass http://corten_on/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection $connection_upgrade;
        }

        location /off/ {
            proxy_pass http://corten_off/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
