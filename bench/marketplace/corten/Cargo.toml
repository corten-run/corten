[package]
name = "marketplace-corten"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
corten = { package = "corten-run", path = "../../../crates/corten", features = ["json", "compress"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
