[package]
name = "httparena-corten"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
corten = { package = "corten-run", path = "../../../crates/corten", features = ["json", "compress"] }
# `rt-multi-thread` for `ARENA_MODE=default`.
# `sync` and `io-util` for the pooled calls (`/pool`).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
