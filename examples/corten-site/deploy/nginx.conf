# nginx in front of the site: TLS and HTTP/2 to browsers, HTTP/1.1 to the app
# (docs/guide/deploy.md, which says why each line is here). provision.sh writes this to
# /etc/nginx/sites-available/corten-site with SITE_DOMAIN replaced by the site's name and
# SITE_REDIRECTS by the names that send their visitors to it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Every open page holds a live stream, and the app holds 4096 connections at once
# (MAX_CONNECTIONS). One reader may hold 64 streams at a time, and all readers together 3584,
# which leaves 512 connections for pages whoever holds the streams; a stream over either limit
# is answered 429. A reader is an IPv4 address or an IPv6 network: a home or a phone is given
# 64 bits of addresses, and counted one by one each of them could hold 64. The limit slows one
# reader; someone with many addresses or networks can still take every stream, and then pages
# are served and their live numbers stay still.
#
# The key is the first four groups of an IPv6 address. nginx writes an address with its first
# longest run of two or more zero groups folded to "::", so the patterns write the zeros a fold
# hides back in: "a:b:c::..." is a:b:c:0, "a:b::..." is a:b:0:0, and "a::..." is a:0:0 and
# then the next group when five follow the fold, or 0 when fewer do. An address that starts
# with the fold ("::1", or an IPv4 address written as IPv6) is no reader's network and is
# counted whole, as an IPv4 address is.
map $remote_addr $corten_site_reader {
    default                                                        $binary_remote_addr;
    "~^(?<network>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"       $network;
    "~^(?<network>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"                $network:0;
    "~^(?<network>[0-9a-f]+:[0-9a-f]+)::"                          $network:0:0;
    "~^(?<first>[0-9a-f]+)::(?<fourth>[0-9a-f]+)(:[0-9a-f]+){4}$"  $first:0:0:$fourth;
    "~^(?<first>[0-9a-f]+)::"                                      $first:0:0:0;
}
limit_conn_zone $corten_site_reader zone=corten_site_readers:10m;
limit_conn_zone $server_name zone=corten_site_streams:1m;
limit_conn_status 429;

# What one reader may ask for, so that one address asking as fast as it can leaves the machine
# to the others. A first visit asks for 14 things, 13 or 14 of them in one second, and twenty
# reloads one after another came to 56 in a second at the most (Firefox, README.md): a reader
# may ask for 100 at once and 20 a second after that, and have 100 answers on their way at a
# time (a page that is read slowly holds memory for as long as it is). Over either the answer
# is 429, and no request under them is kept waiting. Readers behind one address share them:
# seven first visits in the same instant, and one or two a second from then on. This is one
# address's limit and no more: someone with many addresses is not slowed by it (README.md,
# "What one address can do").
#
# A refusal still costs nginx its answer, and one address refused 5,200 to 9,400 times a
# second kept one in ten of another reader's pages waiting half a second to a second. So each
# server below ends a connection after 100 requests (`keepalive_requests`; a browser opens
# another and goes on), and the firewall lets one address open 19 connections in a second
# (provision.sh): together, 1,900 requests a second from one address once the connections it
# holds have asked theirs.
limit_req_zone $corten_site_reader zone=corten_site_asks:10m rate=20r/s;
limit_conn_zone $corten_site_reader zone=corten_site_answers:10m;
limit_req_status 429;
# A request refused for asking too fast is written to neither log: a line for each would fill
# the disk as fast as the requests came. nginx writes its error log from `error` up, and
# these are below it. Nor is a request nginx answers before it counts one (a redirect, a
# method it does not take, a body it will not read), which no limit slows: the variable is
# empty for those. One refused for the answers or the streams an address holds is written to
# both: it was counted here first, so there are 20 of those a second at the most.
limit_req_log_level info;
map $limit_req_status $corten_site_logged {
    default  1;
    REJECTED 0;
    ""       0;
}

# A browser asks for its stream compressed, and the app holds a coder's memory for every stream
# it compresses for as long as the stream is open. The app compresses streams up to a budget of
# its own and sends the rest as they are, so what the coders hold has a top: measured, about
# 69 MiB as zstd and about 191 MiB as gzip (README.md, "What it holds"), and this machine has
# 512 MB for everything on it. So the app is asked for a stream as zstd where the browser lists
# zstd with no q-value (one that gives it a q-value, even q=1, gets the stream as it is), and as
# it is otherwise; pages are asked for as the browser asked. These are variables because a
# proxy_set_header inside a location would drop the server's others.
map $http_accept_encoding $corten_site_stream_coding {
    default                   "";
    "~(^|[, ])zstd *(,|$)"    zstd;
}
map $uri $corten_site_accept_encoding {
    default    $http_accept_encoding;
    ~^/live/   $corten_site_stream_coding;
}

upstream corten_site {
    server 127.0.0.1:3000;
    keepalive 16;              # reuse connections to the app...
    keepalive_timeout 25s;     # ...for less than App::header_timeout (30 s)
}

server {
    listen 80;
    listen [::]:80;
    server_name SITE_DOMAIN SITE_REDIRECTS;
    # A redirect is answered before nginx counts a request against a limit, so nothing slows
    # one address asking for them, and each would be a line in the log: they are not written.
    access_log off;
    keepalive_requests 100;
    # certbot answers its challenge from here when it renews, for every name on the certificate.
    # What is asked for here is counted as the site's requests are, and a file that is not
    # there is not a line in the error log.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        limit_req zone=corten_site_asks burst=100 nodelay;
        log_not_found off;
    }
    location / {
        return 308 https://SITE_DOMAIN$request_uri;
    }
}

server {
    # Ubuntu 24.04's nginx is 1.24, which takes http2 on the listen line; from 1.25.1 it is
    # `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SITE_DOMAIN;    # HOSTS=SITE_DOMAIN
    ssl_certificate     /etc/letsencrypt/live/SITE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_DOMAIN/privkey.pem;

    # The site's own limit on a body is 16 KiB. nginx refuses one over `client_max_body_size`
    # before it counts the request, with a line in its error log each time, so a body that
    # says it is 100,000 bytes or more is refused by a `return`, which writes none, and the
    # limit is for one that does not say, which is read after the request is counted.
    client_max_body_size 100k;
    if ($http_content_length ~ "^0*[1-9][0-9]{5,}$") {
        return 413;
    }
    limit_req zone=corten_site_asks burst=100 nodelay;
    keepalive_requests 100;
    access_log /var/log/nginx/access.log combined if=$corten_site_logged;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # PROXIES=127.0.0.1
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding $corten_site_accept_encoding;   # zstd or none for a stream

    location / {
        limit_conn corten_site_answers 100;
        proxy_pass http://corten_site;
    }
    # The streams are the requests that stay open, so they are counted apart from the answers
    # above: readers who share an address are not refused a page for holding many streams.
    location /live/ {
        limit_conn corten_site_readers 64;
        limit_conn corten_site_streams 3584;
        proxy_pass http://corten_site;
    }
}

# The names that send their visitors to the site's (provision.sh's last argument, written in
# place of SITE_REDIRECTS; `_`, which is no host's name, where there are none). The certificate
# holds them too, so a browser that asks for one over HTTPS is told where the site is, not that
# the certificate is someone else's. This server comes after the site's, which so stays the one
# that answers a name neither lists; the app refuses that name (HOSTS).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SITE_REDIRECTS;
    ssl_certificate     /etc/letsencrypt/live/SITE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_DOMAIN/privkey.pem;
    access_log off;   # as on port 80
    keepalive_requests 100;
    # In a location: nginx reads `keepalive_requests` for a connection over HTTP/1.1 once it
    # has chosen one, and a `return` outside any is answered before that.
    location / {
        return 308 https://SITE_DOMAIN$request_uri;
    }
}
