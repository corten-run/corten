# nginx in front of the site: TLS and HTTP/2 to browsers, HTTP/1.1 to the app
# (docs/guide/deploy.md, which says why each line is here). provision.sh writes this to
# /etc/nginx/sites-available/corten-site with SITE_DOMAIN replaced by the site's name.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Every open page holds a live stream, and the app holds 4096 connections at once
# (MAX_CONNECTIONS). One reader may hold 64 streams at a time, and all readers together 3584,
# which leaves 512 connections for pages whoever holds the streams; a stream over either limit
# is answered 429. A reader is an IPv4 address or an IPv6 network: a home or a phone is given
# 64 bits of addresses, and counted one by one each of them could hold 64. The limit slows one
# reader; someone with many addresses or networks can still take every stream, and then pages
# are served and their live numbers stay still.
#
# The key is the first four groups of an IPv6 address. nginx writes an address with its first
# longest run of two or more zero groups folded to "::", so the patterns write the zeros a fold
# hides back in: "a:b:c::..." is a:b:c:0, "a:b::..." is a:b:0:0, and "a::..." is a:0:0 and
# then the next group when five follow the fold, or 0 when fewer do. An address that starts
# with the fold ("::1", or an IPv4 address written as IPv6) is no reader's network and is
# counted whole, as an IPv4 address is.
map $remote_addr $corten_site_reader {
    default                                                        $binary_remote_addr;
    "~^(?<network>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"       $network;
    "~^(?<network>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"                $network:0;
    "~^(?<network>[0-9a-f]+:[0-9a-f]+)::"                          $network:0:0;
    "~^(?<first>[0-9a-f]+)::(?<fourth>[0-9a-f]+)(:[0-9a-f]+){4}$"  $first:0:0:$fourth;
    "~^(?<first>[0-9a-f]+)::"                                      $first:0:0:0;
}
limit_conn_zone $corten_site_reader zone=corten_site_readers:10m;
limit_conn_zone $server_name zone=corten_site_streams:1m;
limit_conn_status 429;

# A browser asks for its stream compressed, and the app holds a coder's memory for every stream
# it compresses for as long as the stream is open. The app compresses streams up to a budget of
# its own and sends the rest as they are, so what the coders hold has a top: measured, about
# 69 MiB as zstd and about 191 MiB as gzip (README.md, "What it holds"), and this machine has
# 512 MB for everything on it. So the app is asked for a stream as zstd where the browser lists
# zstd with no q-value (one that gives it a q-value, even q=1, gets the stream as it is), and as
# it is otherwise; pages are asked for as the browser asked. These are variables because a
# proxy_set_header inside a location would drop the server's others.
map $http_accept_encoding $corten_site_stream_coding {
    default                   "";
    "~(^|[, ])zstd *(,|$)"    zstd;
}
map $uri $corten_site_accept_encoding {
    default    $http_accept_encoding;
    ~^/live/   $corten_site_stream_coding;
}

upstream corten_site {
    server 127.0.0.1:3000;
    keepalive 16;              # reuse connections to the app...
    keepalive_timeout 25s;     # ...for less than App::header_timeout (30 s)
}

server {
    listen 80;
    listen [::]:80;
    server_name SITE_DOMAIN;
    # certbot answers its challenge from here when it renews.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04's nginx is 1.24, which takes http2 on the listen line; from 1.25.1 it is
    # `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SITE_DOMAIN;    # HOSTS=SITE_DOMAIN
    ssl_certificate     /etc/letsencrypt/live/SITE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_DOMAIN/privkey.pem;

    client_max_body_size 64k;   # more than twice the site's body limit (16 KiB)
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # PROXIES=127.0.0.1
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding $corten_site_accept_encoding;   # zstd or none for a stream

    location / {
        proxy_pass http://corten_site;
    }
    # The streams are the requests that stay open, so they are the ones counted: readers who
    # share an address are not refused a page for being many.
    location /live/ {
        limit_conn corten_site_readers 64;
        limit_conn corten_site_streams 3584;
        proxy_pass http://corten_site;
    }
}
