# Load balancer for the failover benchmark: round-robin over instances a and b, SSE-friendly.
# Fixed IPs (see run.mjs), so a restarted instance comes back at the same address.
worker_processes 2;
# Warnings too: run.mjs counts "upstream server temporarily disabled" and "no live upstreams".
error_log /dev/stderr warn;
events {
  worker_connections 8192;
}
http {
  access_log off;
  # Requests that end. An instance that fails one is left out for 2 s, then gets one request as a
  # trial, and is back once that request has ended well.
  upstream feeds {
    server 10.77.77.21:8080 max_fails=1 fail_timeout=2s;
    server 10.77.77.22:8080 max_fails=1 fail_timeout=2s;
    keepalive 64;
  }
  # Feed streams, without that: a trial clears an instance's failures only when it ends, and a
  # stream does not end, so a restarted instance could stay out of one worker's upstream a trial at
  # a time; once the other instance was killed, that worker answered reconnects 502 itself
  # ("no live upstreams", #1775). Here a stream sent to a dead instance moves to the other after
  # the connect timeout, a short one for this local network: a killed container's address often
  # does not refuse, it does not answer. The location assumes a seller key without "/".
  upstream streams {
    server 10.77.77.21:8080 max_fails=0;
    server 10.77.77.22:8080 max_fails=0;
  }
  server {
    listen 8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_connect_timeout 1s;
    # GETs (snapshots, streams) move to the other instance; a POST already sent is not retried.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    location / {
      proxy_pass http://feeds;
    }
    location ~ ^/feeds/[^/]+/live$ {
      proxy_pass http://streams;
      proxy_connect_timeout 250ms;
    }
  }
}
