[package]
name = "card-market"
version = "0.1.0"
edition = "2024"
publish = false
description = "A marketplace item page on Corten with the production pieces on: CSP, versioned assets, PWA, i18n, compression, MCP tools."

[dependencies]
corten = { package = "corten-run", path = "../../crates/corten", features = ["json", "agent", "compress"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
# Already in Corten's tree: the CSP reports the browser sends are logged.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# Only for the `render_cost` and `route_loop` benchmarks, which time requests through the router
# itself, beside axum alone; the tests send theirs with `app.test()`.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
